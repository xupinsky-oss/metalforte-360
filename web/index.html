<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METALFORTE 360 | Command Center</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script></head>
<body><header><div><span class="brand">METALFORTE</span><span class="sub">360 · Command Center</span></div><button id="logout" class="ghost" hidden>Sair</button></header><main>
<section id="login" class="card login"><h1>Acesso ao Command Center</h1><p>Entre com seu usuário corporativo.</p><form id="login-form"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button><p id="login-error" class="error"></p></form></section>
<section id="dashboard" hidden><div class="title-row"><div><h1>Performance comercial</h1><p id="periodo"></p></div><p id="atualizado" class="freshness"></p></div><div id="kpis" class="kpis"></div><section class="card"><h2>Evolução mensal</h2><p class="muted">Faturamento e margem dos últimos 12 meses.</p><canvas id="monthly-chart"></canvas></section><div id="panels"></div></section>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
