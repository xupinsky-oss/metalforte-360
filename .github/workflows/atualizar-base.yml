name: Atualizar base comercial

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID da solicitação da Control Tower (opcional)"
        required: false
        type: string
      environment:
        description: "Ambiente de destino"
        required: true
        default: homologacao
        type: choice
        options: [homologacao, producao]
      scope:
        description: "Escopo da atualização"
        required: true
        default: full
        type: choice
        options: [full]
      requested_by:
        description: "Solicitante (preenchido pela Control Tower)"
        required: false
        type: string
      reason:
        description: "Motivo operacional"
        required: true
        type: string
      confirmation:
        description: "Digite ATUALIZAR para produção ou HOMOLOGAR para homologação"
        required: true
        type: string
  schedule:
    # Duas oportunidades por hora: uma execução atrasada pode ser recuperada
    # na segunda janela. O bloqueio abaixo mantém no máximo uma carga/hora.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
    
concurrency:
  group: atualizar-base-metalforte
  cancel-in-progress: false

jobs:
  agenda:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      executar: ${{ steps.intervalo.outputs.executar }}
    steps:
      - name: Evitar carga duplicada e recuperar falhas
        id: intervalo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          response=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/atualizar-base.yml/runs?status=completed&per_page=20" || true)
          last_success=$(printf '%s' "$response" | jq -r --arg current "$CURRENT_RUN" '[.workflow_runs[]? | select((.id|tostring) != $current and .conclusion == "success") | .updated_at] | sort | last // empty' 2>/dev/null || true)
          now_epoch=$(date -u +%s)
          last_epoch=0
          if [ -n "$last_success" ]; then
            last_epoch=$(date -u -d "$last_success" +%s 2>/dev/null || echo 0)
          fi
          age_seconds=$((now_epoch - last_epoch))
          if [ "$last_epoch" -gt 0 ] && [ "$age_seconds" -lt 3300 ]; then
            echo "executar=false" >> "$GITHUB_OUTPUT"
            echo "Carga bem-sucedida há ${age_seconds}s; esta janela será ignorada."
          else
            echo "executar=true" >> "$GITHUB_OUTPUT"
            echo "Última carga bem-sucedida ausente ou com pelo menos 55 minutos; iniciar atualização."
          fi

  atualizar:
    needs: [agenda]
    if: always() && (github.event_name != 'schedule' || needs.agenda.outputs.executar == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TOTVS_LOGIN: ${{ secrets.TOTVS_LOGIN }}
      TOTVS_PASSWORD: ${{ secrets.TOTVS_PASSWORD }}
      TOTVS_BASE_URL: https://analytics.totvs.com.br
      TOTVS_WORKSPACE: sltez8zoyskp9vazf6jomo5askrbntnl
      TOTVS_DASHBOARD: "11078478"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_BUCKET: metalforte-private
      # A homologação publica em objetos isolados e nunca substitui a base ativa.
      SUPABASE_DATA_PATH: ${{ inputs.environment == 'homologacao' && 'bases/homologacao/metalforte_base.csv.gz' || 'bases/metalforte_base.csv.gz' }}
      SUPABASE_TARGET_XLSX_PATH: ${{ inputs.environment == 'homologacao' && 'bases/homologacao/metalforte_metas.xlsx' || 'bases/metalforte_metas.xlsx' }}
      SUPABASE_TARGET_LEGACY_PATH: ${{ inputs.environment == 'homologacao' && 'bases/homologacao/metalforte_metas.csv.gz' || 'bases/metalforte_metas.csv.gz' }}
      SUPABASE_STOCK_PATH: ${{ inputs.environment == 'homologacao' && 'bases/homologacao/metalforte_estoque.csv.gz' || 'bases/metalforte_estoque.csv.gz' }}
      TOTVS_TARGET_KG_MULTIPLIER: "1000"
      TOTVS_INDICATOR_WEIGHT_MULTIPLIER: "1"
      TOTVS_TARGET_OFFSET_FROM: "-12"
      TOTVS_TARGET_OFFSET_TO: "12"
      SUPABASE_DASHBOARD_PATH: ${{ inputs.environment == 'homologacao' && 'dashboard/homologacao/command-center.json' || 'dashboard/command-center.json' }}
      ETL_REQUEST_ID: ${{ inputs.request_id || format('scheduled-{0}', github.run_id) }}
      ETL_ENVIRONMENT: ${{ inputs.environment || 'producao' }}
      ETL_SCOPE: ${{ inputs.scope || 'full' }}
      ETL_REQUESTED_BY: ${{ inputs.requested_by || github.actor }}
      ETL_REASON: ${{ inputs.reason || 'Execução automática agendada' }}
      ETL_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - name: Validar autorização da execução manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "producao" ] && [ "$CONFIRMATION" != "ATUALIZAR" ]; then
            echo "Confirmação de produção inválida."
            exit 1
          fi
          if [ "$TARGET_ENVIRONMENT" = "homologacao" ] && [ "$CONFIRMATION" != "HOMOLOGAR" ]; then
            echo "Confirmação de homologação inválida."
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Iniciar telemetria sanitizada
        run: |
          python scripts/etl_status.py start --message "Execução iniciada pelo GitHub Actions"
          python scripts/etl_status.py step --index 2 --status completed --message "Ambiente preparado"
      - name: Atualizar, validar e publicar a base privada
        shell: bash
        run: |
          python scripts/etl_status.py step --index 3 --status running --message "Coleta e consolidação iniciadas"
          succeeded=false
          for attempt in 1 2 3; do
            echo "Tentativa ${attempt} de 3"
            if python atualizar_gooddata.py; then
              succeeded=true
              break
            fi
            if [ "${attempt}" -lt 3 ]; then sleep 60; fi
          done
          if [ "$succeeded" != "true" ]; then
            python scripts/etl_status.py step --index 3 --status failed --message "Coleta falhou após três tentativas"
            exit 1
          fi
          python scripts/etl_status.py step --index 3 --status completed --message "Coleta TOTVS / GoodData concluída"
          python scripts/etl_status.py step --index 4 --status completed --message "Validações mínimas aprovadas"
          python scripts/etl_status.py step --index 5 --status completed --message "Tratamento e normalização concluídos"
          python scripts/etl_status.py step --index 6 --status completed --message "Base privada publicada"
      - name: Gerar e publicar agregados do painel
        shell: bash
        run: |
          python scripts/etl_status.py step --index 7 --status running --message "Geração de métricas iniciada"
          if ! python gerar_dashboard_web.py; then
            python scripts/etl_status.py step --index 7 --status failed --message "Falha ao gerar ou publicar agregados"
            exit 1
          fi
          python scripts/etl_status.py step --index 7 --status completed --message "Métricas e agregados gerados"
          python scripts/etl_status.py step --index 8 --status completed --message "Resumo privado publicado"
          python scripts/etl_status.py step --index 9 --status completed --message "Publicação validada pelo processo"
          python scripts/etl_status.py step --index 10 --status completed --message "Painel disponível para reconsulta"
      - name: Atualizar resumos por vendedor
        if: github.event_name == 'schedule' || inputs.environment == 'producao'
        run: python scripts/publish_seller_snapshots.py
      - name: Finalizar telemetria
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            python scripts/etl_status.py finish --status completed --message "Execução concluída com sucesso"
          else
            python scripts/etl_status.py finish --status failed --message "Execução encerrada com falha; consulte o log protegido do GitHub"
          fi
