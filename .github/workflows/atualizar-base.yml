name: Atualizar base comercial

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC: 09h e 15h = 06h e 12h em São Paulo.
    - cron: "0 9,15 * * *"
    # 21h30 UTC = 18h30 em São Paulo.
    - cron: "30 21 * * *"

concurrency:
  group: atualizar-base-metalforte
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TOTVS_LOGIN: ${{ secrets.TOTVS_LOGIN }}
      TOTVS_PASSWORD: ${{ secrets.TOTVS_PASSWORD }}
      TOTVS_BASE_URL: https://analytics.totvs.com.br
      TOTVS_WORKSPACE: sltez8zoyskp9vazf6jomo5askrbntnl
      TOTVS_DASHBOARD: "11078478"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_BUCKET: metalforte-private
      SUPABASE_DATA_PATH: bases/metalforte_base.csv.gz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Atualizar, validar e publicar a base
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Tentativa ${attempt} de 3"
            if python atualizar_gooddata.py; then
              python gerar_dashboard_web.py
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep 60
            fi
          done
          exit 1
