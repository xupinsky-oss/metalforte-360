name: Completar detalhe de SKU do painel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/completar-skus-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_BUCKET: metalforte-private
      SUPABASE_DATA_PATH: bases/metalforte_base.csv.gz
      SUPABASE_DASHBOARD_PATH: dashboard/command-center.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Completar margem e clientes por SKU na base já publicada
        run: python scripts/backfill_sku_snapshot.py
