name: Verificar painéis e erros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, CODEX/AJUSTES]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-paineis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Testes e abertura das páginas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências do painel
        run: python -m pip install -r requirements.txt

      - name: Verificar sintaxe dos módulos
        run: python -m compileall -q app.py src scripts

      - name: Rodar testes de métricas, dados e painéis
        run: python -m unittest discover -s tests -v
